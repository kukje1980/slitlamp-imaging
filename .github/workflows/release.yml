name: Publish integrated release
on:
  workflow_dispatch:
  push:
    branches: [main, claude/fervent-fermi-uplzuu]   # main 이 안저 뷰어로 바뀐 뒤 슬릿램프 배포 브랜치
permissions:
  contents: write
concurrency:
  group: slitlamp-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r web/requirements-dev.txt
      - name: Web regression tests
        working-directory: web
        run: python -m pytest tests -q
      - name: Package web deployment sources
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          mkdir -p out
          git archive --format=zip --output="out/SlitLamp-Web-${VERSION}.zip" HEAD web VERSIONS.md
      - uses: actions/upload-artifact@v4
        with:
          name: SlitLamp-Web
          path: out/*.zip
  mac:
    uses: ./.github/workflows/build-mac.yml
  windows:
    uses: ./.github/workflows/build-windows.yml
  publish:
    needs: [web, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish verified installers and web sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          TAG="v${VERSION}"
          git archive --format=zip --prefix="SlitLamp-${VERSION}/" --output="out/SlitLamp-Source-${VERSION}.zip" HEAD
          (cd out && sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "${{ github.sha }}" --latest --title "SlitLamp ${TAG} 통합판" --notes-file "docs/RELEASE-${VERSION}.md"
          fi
