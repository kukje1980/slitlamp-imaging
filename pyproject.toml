[project]
name = "slitlamp-imaging"
version = "1.20.2"
description = "안과 슬릿램프 디지털 영상 시스템 (HDMI 캡처/환자 DB)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B"]
ignore = ["N802", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
